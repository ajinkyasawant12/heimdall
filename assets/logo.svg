<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <filter id="eye-glow-logo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Crimson Helmet Shell (Mark III) -->
  <path d="M 50,6 
           C 28,6 20,24 20,44 
           L 17,44 
           L 17,66 
           L 24,66 
           L 24,80 
           L 34,98 
           L 38,114 
           L 62,114 
           L 66,98 
           L 76,80 
           L 76,66 
           L 83,66 
           L 83,44 
           L 80,44 
           C 80,24 72,6 50,6 Z" 
        fill="#b91c1c" 
        stroke="#7f1d1d" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Ear / Temple Flanges -->
  <path d="M 17,46 L 20,46 L 20,64 L 17,64 Z" fill="#7f1d1d" />
  <path d="M 80,46 L 83,46 L 83,64 L 80,64 Z" fill="#7f1d1d" />

  <!-- Gold Faceplate -->
  <path d="M 28,32
           C 29,22 36,20 41,20
           L 46,36
           L 54,36
           L 59,20
           C 64,20 71,22 72,32
           C 74,42 72,54 71,58
           L 67,60
           L 69,72
           L 61,84
           L 61,96
           L 39,96
           L 39,84
           L 31,72
           L 33,60
           L 29,58
           C 28,54 26,42 28,32 Z"
        fill="#f59e0b"
        stroke="#b45309"
        stroke-width="2"
        stroke-linejoin="round" />

  <!-- Forehead Red Center Wedge -->
  <polygon points="41,18 46,35 54,35 59,18" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5" />

  <!-- Cheek Groove Contours -->
  <path d="M 32,62 L 41,66 L 41,83 L 35,94" fill="none" stroke="#450a0a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 68,62 L 59,66 L 59,83 L 65,94" fill="none" stroke="#450a0a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Chin / Mouth Plate -->
  <polygon points="41,86 59,86 59,102 41,102" fill="#f59e0b" stroke="#b45309" stroke-width="1.6" />
  <!-- Mouth Slit -->
  <line x1="43" y1="91" x2="57" y2="91" stroke="#450a0a" stroke-width="2" stroke-linecap="round" />

  <!-- Lower Chin Accent -->
  <polygon points="38,112 62,112 59,103 41,103" fill="#7f1d1d" />

  <!-- Eye Sockets -->
  <polygon points="29,52 43,55 43,59 30,58" fill="#450a0a" stroke="#450a0a" stroke-width="1.2" />
  <polygon points="71,52 57,55 57,59 70,58" fill="#450a0a" stroke="#450a0a" stroke-width="1.2" />

  <!-- Glowing Eye Slits -->
  <polygon points="31,54 42,56 42,58 31,57" fill="#ffffff" filter="url(#eye-glow-logo)" />
  <polygon points="69,54 58,56 58,58 69,57" fill="#ffffff" filter="url(#eye-glow-logo)" />
</svg>
